<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossard Collège - Crash Stickman</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .window {
            width: 780px;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .title-bar {
            background-color: #21262d;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .title-text {
            margin-left: 15px;
            font-size: 14px;
            color: #8b949e;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            background-color: #0d1117;
            border-bottom: 1px solid #30363d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 160px;
        }

        pre {
            padding: 22px;
            background-color: #161b22;
            font-size: 15px;
            line-height: 1.6;
            overflow-x: auto;
            color: #e6edf3;
        }

        /* Coloration syntaxique style VS Code */
        .keyword { color: #ff7b72; font-weight: bold; }
        .function { color: #d2a8ff; }
        .string { color: #a5d6ff; }
        .number { color: #79c0ff; }
        .comment { color: #8b949e; font-style: italic; }
        .orange { color: #ffa657; }
    </style>
</head>
<body>

    <div class="window">
        <!-- Barre de titre -->
        <div class="title-bar">
            <div class="dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <span class="title-text">crash_vitesse_1000.js</span>
        </div>

        <!-- Zone d'animation Canvas -->
        <div class="canvas-container">
            <canvas id="stickmanCanvas" width="780" height="160"></canvas>
        </div>

        <!-- Zone de code -->
        <pre><code><span class="comment">// Crash à vitesse 1000 contre le mur du fond</span>
<span class="keyword">const</span> vitesse = <span class="number">1000</span>;
<span class="keyword">function</span> <span class="function">crashImpact</span>() {
    <span class="keyword">let</span> impactForce = vitesse * <span class="number">2.5</span>;
    <span class="function">console</span>.<span class="function">error</span>(<span class="string">"ERREUR CRITIQUE : Impact violent détecté !"</span>);
}</code></pre>
    </div>

    <script>
        const canvas = document.getElementById('stickmanCanvas');
        const ctx = canvas.getContext('2d');

        function drawCrashScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = 130;
            const wallX = 680; // Position du mur à droite

            // 1. Dessiner le sol
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // 2. Dessiner le mur vertical avec des fissures d'impact
            ctx.strokeStyle = '#ff3355';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(wallX, 0);
            ctx.lineTo(wallX, groundY);
            ctx.stroke();

            // Fissures et éclats sur le mur autour de l'impact
            ctx.strokeStyle = 'rgba(255, 51, 85, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(wallX, 90); ctx.lineTo(wallX - 35, 80);
            ctx.moveTo(wallX - 35, 80); ctx.lineTo(wallX - 55, 65);
            ctx.moveTo(wallX, 90); ctx.lineTo(wallX - 25, 105);
            ctx.moveTo(wallX, 60); ctx.lineTo(wallX - 40, 50);
            ctx.stroke();

            // 3. Traînées de vitesse extrêmes (provenant de la gauche)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            for (let i = 100; i < wallX - 50; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 40); ctx.lineTo(i + 40, 40);
                ctx.moveTo(i + 15, 85); ctx.lineTo(i + 55, 85);
                ctx.moveTo(i + 5, 115); ctx.lineTo(i + 45, 115);
                ctx.stroke();
            }

            // 4. Le Stickman écrasé contre le mur
            const stickX = wallX - 15;
            const headY = groundY - 60;
            
            ctx.strokeStyle = '#ff3355';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Tête écrasée (légèrement aplatie/ovale contre le mur)
            ctx.beginPath();
            ctx.ellipse(stickX + 5, headY, 11, 8, Math.PI / 6, 0, Math.PI * 2);
            ctx.stroke();

            // Tronc comprimé
            const hipY = groundY - 25;
            ctx.beginPath();
            ctx.moveTo(stickX + 5, headY + 8);
            ctx.lineTo(stickX, hipY);
            ctx.stroke();

            // Bras compressés / projetés en arrière par la décimale d'arrêt
            ctx.beginPath();
            ctx.moveTo(stickX, hipY - 15);
            ctx.lineTo(stickX - 30, hipY - 25); // Bras en arrière
            ctx.moveTo(stickX, hipY - 15);
            ctx.lineTo(stickX - 10, hipY + 5);  // Bras replié
            ctx.stroke();

            // Jambes pliées par le choc
            ctx.beginPath();
            ctx.moveTo(stickX, hipY);
            ctx.lineTo(stickX - 25, groundY - 5);
            ctx.moveTo(stickX, hipY);
            ctx.lineTo(stickX - 10, groundY);
            ctx.stroke();

            // 5. Particules et éclats rouges dispersés au moment de l'impact
            const particles = [
                {x: wallX - 25, y: 75, r: 4},
                {x: wallX - 45, y: 55, r: 3},
                {x: wallX - 20, y: 95, r: 2.5},
                {x: wallX - 60, y: 85, r: 5},
                {x: wallX - 35, y: 110, r: 3.5},
                {x: wallX - 15, y: 50, r: 2},
                {x: wallX - 50, y: 40, r: 3},
                {x: wallX - 70, y: 70, r: 4.5},
                {x: wallX - 30, y: 30, r: 2},
            ];

            particles.forEach(p => {
                ctx.fillStyle = '#ff3355';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Quelques étincelles jaunes/oranges d'impact
            const sparks = [
                {x: wallX - 10, y: 65},
                {x: wallX - 40, y: 90},
                {x: wallX - 25, y: 45}
            ];
            sparks.forEach(s => {
                ctx.fillStyle = '#ffa657';
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Dessin unique figé (parfait pour capture d'écran immédiate)
        drawCrashScene();
    </script>

</body>
</html>
